name: Validate skill package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r plugins/marketing-creative/skills/marketing-image-producer/scripts/requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_package.py
      - run: python3 scripts/build_plugin.py --output /tmp/marketing-creative-plugin.zip
